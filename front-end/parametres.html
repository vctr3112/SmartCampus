<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SmartCampus - Paramètres</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: Arial, sans-serif;
display: flex;
min-height: 100vh;
}

.sidebar {
background: #d4ac0d;
color: white;
width: 220px;
min-height: 100vh;
padding: 20px;
}

.sidebar-logo {
margin-bottom: 30px;
}

.sidebar-logo p {
font-size: 13px;
}

.sidebar ul {
list-style: none;
}

.sidebar ul li {
margin-bottom: 12px;
}

.sidebar ul li a {
color: white;
text-decoration: none;
font-size: 14px;
}

.sidebar ul li a:hover {
text-decoration: underline;
}

.main {
flex: 1;
display: flex;
flex-direction: column;
}

.header {
background: #f1c40f;
color: white;
padding: 20px;
display: flex;
justify-content: space-between;
align-items: center;
}

.header-user p {
font-size: 14px;
}

.header-logo {
text-align: right;
}

.header-logo img {
width: 40px;
height: 40px;
}

.header-logo p {
font-size: 14px;
}

.header-logo a {
color: white;
font-size: 13px;
}

.content {
padding: 30px;
background: #f0f2f5;
flex: 1;
}

.content h1 {
margin-bottom: 24px;
}

.form-container {
background: white;
border: 1px solid #ccc;
padding: 30px;
max-width: 600px;
}

.form-container h2 {
margin-bottom: 20px;
}

form label {
display: block;
margin-top: 12px;
}

form input {
width: 100%;
padding: 10px;
border: 1px solid #999;
}

form input:focus {
border: 2px solid #003366;
outline: none;
}

.form-buttons {
margin-top: 20px;
}

.btn-valider {
background: #27ae60;
color: white;
padding: 10px 20px;
border: none;
cursor: pointer;
font-size: 14px;
}

.btn-valider:hover {
background: #1e8449;
}

.error-msg {
background: #ffe0e0;
border: 1px solid red;
color: red;
padding: 10px;
margin-bottom: 16px;
display: none;
}

.error-msg.visible {
display: block;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {

fetch("traitement_parametres.php?infos")
.then(function(response) {
return response.json();
})
.then(function(data) {
document.getElementById("nom_user").textContent = data.nom;
document.getElementById("prenom_user").textContent = data.prenom;
});

var form = document.getElementById("form-parametres");
var errorMsg = document.getElementById("errorMsg");
form.addEventListener("submit", function(e) {
e.preventDefault();
var mdp = document.getElementById("mot_de_passe").value;
var confirmer = document.getElementById("confirmer_mot_de_passe").value;
if (mdp !== "" && mdp !== confirmer) {
errorMsg.textContent = "Les mots de passe ne correspondent pas.";
errorMsg.classList.add("visible");
return;
}
errorMsg.classList.remove("visible");
form.submit();
});
});
</script>
</head>
<body>
<div class="sidebar">
<div class="sidebar-logo">
<p>Mon espace</p>
</div>
<ul>
<li><a href="javascript:history.back()">Retour</a></li>
</ul>
</div>
<div class="main">
<div class="header">
<div class="header-user">
<p><strong>Nom :</strong> <span id="nom_user">...</span></p>
<p><strong>Prénom :</strong> <span id="prenom_user">...</span></p>
</div>
<div class="header-logo">
<img src="logo.png" alt="logo">
<p>SmartCampus</p>
<a href="connexion.html">Déconnexion</a>
</div>
</div>
<div class="content">
<h1>Paramètres</h1>
<div class="form-container">
<h2>Modifier mes informations</h2>
<div class="error-msg" id="errorMsg"></div>
<form id="form-parametres" action="traitement_parametres.php" method="POST">
<label for="nom">Nom :</label>
<input type="text" id="nom" name="nom">
<label for="prenom">Prénom :</label>
<input type="text" id="prenom" name="prenom">
<label for="email">Email :</label>
<input type="email" id="email" name="email">
<label for="mot_de_passe">Nouveau mot de passe :</label>
<input type="password" id="mot_de_passe" name="mot_de_passe">
<label for="confirmer_mot_de_passe">Confirmer le mot de passe :</label>
<input type="password" id="confirmer_mot_de_passe" name="confirmer_mot_de_passe">
<div class="form-buttons">
<button type="submit" class="btn-valider" name="modifier">Valider la saisie</button>
</div>
</form>
</div>
</div>
</div>
</body>
</html>
