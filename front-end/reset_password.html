<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SmartCampus - Réinitialisation du mot de passe</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: Arial, sans-serif;
background: #f0f2f5;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}

.login-container {
background: white;
padding: 40px;
border: 1px solid #ccc;
width: 100%;
max-width: 420px;
}

.login-container h1 {
text-align: center;
margin-bottom: 24px;
font-size: 20px;
}

.error-msg {
background: #ffe0e0;
border: 1px solid red;
color: red;
padding: 10px;
margin-bottom: 16px;
display: none;
}

.error-msg.visible {
display: block;
}

form label {
display: block;
margin-top: 12px;
margin-bottom: 4px;
}

form input {
width: 100%;
padding: 10px;
border: 1px solid #999;
}

form input:focus {
border: 2px solid #003366;
outline: none;
}

button {
width: 100%;
background: #222;
color: white;
padding: 10px;
border: none;
margin-top: 20px;
font-size: 15px;
cursor: pointer;
}

button:hover {
background: #444;
}

.retour {
display: block;
text-align: center;
margin-top: 16px;
font-size: 13px;
color: #003366;
text-decoration: none;
}

.retour:hover {
text-decoration: underline;
}
</style>


</head>
<body>

<div class="login-container">
<h1>Mettre à jour votre mot de passe</h1>

<div class="error-msg" id="errorMsg"></div>

<form id="form-reset" action="traitement_reset_password.php" method="POST">

<label for="email">Email :</label>
<input type="email" id="email" name="email">

<label for="mot_de_passe">Nouveau mot de passe :</label>
<input type="password" id="mot_de_passe" name="mot_de_passe">

<label for="confirmer_mot_de_passe">Confirmer le mot de passe :</label>
<input type="password" id="confirmer_mot_de_passe" name="confirmer_mot_de_passe">

<button type="submit" name="reset">VALIDER</button>

</form>

<a href="connexion.html" class="retour">Retour à la connexion</a>

</div>

</body>
</html>
