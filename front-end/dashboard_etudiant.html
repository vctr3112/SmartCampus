<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SmartCampus - Tableau de bord Étudiant</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: Arial, sans-serif;
}

body {
display: flex;
min-height: 100vh;
}

.sidebar {
background: #92d089;
width: 250px;
min-height: 100vh;
padding: 20px;
border-right: 2px solid #7cb374;
}

.sidebar-header {
margin-bottom: 40px;
}

.sidebar-header p {
font-size: 14px;
font-weight: bold;
}

.sidebar ul {
list-style: none;
}

.sidebar ul li {
margin-bottom: 15px;
display: flex;
align-items: center;
}

.sidebar ul li::before {
content: "•";
margin-right: 10px;
font-size: 20px;
}

.sidebar ul li a {
color: black;
text-decoration: none;
font-size: 16px;
}

.sidebar ul li a:hover {
font-weight: bold;
}

.main {
flex: 1;
display: flex;
flex-direction: column;
background: #ffffff;
}

.header {
background: #b7e4b1;
padding: 20px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 2px solid #99c294;
}

.header-user {
font-size: 14px;
}

.header-logo {
text-align: right;
display: flex;
flex-direction: column;
align-items: flex-end;
}

.header-logo img {
width: 40px;
height: 40px;
}

.header-logo p {
font-size: 14px;
margin-top: 5px;
}

.header-logo a {
color: black;
font-size: 12px;
text-decoration: none;
margin-top: 5px;
}

.header-logo a:hover {
text-decoration: underline;
}

.content {
padding: 30px;
flex: 1;
}

.content h1 {
margin-bottom: 24px;
font-weight: normal;
}

.cards {
display: flex;
gap: 20px;
margin-bottom: 20px;
}

.card {
background: white;
border: 2px solid grey;
border-radius: 5px;
padding: 20px;
flex: 1;
min-height: 250px;
display: flex;
flex-direction: column;
}

.card h2 {
margin-top: 40px;
font-size: 18px;
text-align: center;
color: #333;
font-weight: normal;
}

.card-data {
text-align: center;
margin-top: 20px;
font-weight: bold;
font-size: 16px;
color: #555;
}

.note-highlight {
font-size: 24px;
color: #2e7d32;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
fetch("traitement_dashboard_etudiant.php")
.then(function(response) {
return response.json();
})
.then(function(data) {
if (data.erreur) {
alert(data.erreur);
window.location.href = "connexion.html";
return;
}

document.getElementById("nom_etudiant").textContent = data.nom;
document.getElementById("prenom_etudiant").textContent = data.prenom;
document.getElementById("id_etudiant").textContent = data.id_etudiant;

document.getElementById("prochain_cours").textContent = data.prochain_cours;
document.getElementById("prochain_salle").textContent = data.prochain_salle;
document.getElementById("prochain_heure").textContent = data.prochain_heure;

document.getElementById("note_cours").textContent = data.note_cours;
document.getElementById("note_valeur").textContent = data.note_valeur;
})
.catch(function(error) {
console.error("Erreur lors de la récupération des données:", error);
});
});
</script>

</head>

<body>

<div class="sidebar">
<div class="sidebar-header">
<p>Espace étudiant</p>
</div>
<ul>
<li><a href="dashboard_etudiant.html">Tableau de bord</a></li>
<li><a href="consultation_notes.html">Mes notes</a></li>
<li><a href="edt_etudiant.html">Mon emploi du temps</a></li>
<li><a href="parametres.html">Paramètres</a></li>
</ul>
</div>

<div class="main">

<div class="header">
<div class="header-user">
<p><strong>Nom :</strong> <span id="nom_etudiant">...</span></p>
<p><strong>Prénom :</strong> <span id="prenom_etudiant">...</span></p>
<p><strong>id étudiant :</strong> <span id="id_etudiant">...</span></p>
</div>

<div class="header-logo">
<img src="logo.png" alt="logo">
<p>SmartCampus</p>
<a href="connexion.html">*Déconnexion</a>
</div>
</div>

<div class="content">
<h1>Tableau de bord</h1>

<div class="cards">
<div class="card">
<h2>Prochain cours</h2>
<div class="card-data">
<span id="prochain_cours">Chargement...</span><br>
<span id="prochain_salle"></span><br>
<span id="prochain_heure"></span>
</div>
</div>

<div class="card">
<h2>Notes récentes</h2>
<div class="card-data">
<span id="note_cours">Chargement...</span><br>
<span id="note_valeur" class="note-highlight"></span>
</div>
</div>

<div class="card">
<h2>Présence</h2>
<div class="card-data">
<span>À jour</span>
</div>
</div>
</div>

</div>
</div>

</body>
</html>
